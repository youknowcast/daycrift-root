name: deploy s3

on:
  push:
    branches:
      - master
  schedule:
    # 予約投稿 (pubDatetime が未来の記事) を公開時刻に反映するための定期ビルド
    - cron: "0 */6 * * *"
  workflow_dispatch:
concurrency:
  # push / schedule / 手動実行が並行して S3 へ sync すると古い成果物が
  # 後から上書きされるため、デプロイは直列化して最新の実行を優先する
  group: deploy-s3
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2
      - name: ci
        run: npm ci
      - name: lint
        run: npm run lint
      - name: build
        run: npm run build
      - name: Sync to S3
        env:
          S3_CONTENTS_BUCKET: ${{ secrets.S3_CONTENTS_BUCKET }}
        run: |
          set -euo pipefail
          aws s3 sync ./dist s3://$S3_CONTENTS_BUCKET/ --delete --only-show-errors
      - name: invalidate cloudfront
        env:
          S3_CONTENTS_BUCKET: ${{ secrets.S3_CONTENTS_BUCKET }}
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.AWS_CLOUDFRONT_DAYCRIFT_NET_DISTRIBUTION_ID }} --paths "/*"
